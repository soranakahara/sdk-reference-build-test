name: Publish SDK references to Pages

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: 'Commit SHA of the generated HTML to publish'
        required: true
        type: string

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.server_url == 'https://github.com' && github.repository == 'soranakahara/sdk-reference-build-test' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: 'false'
      - name: Check out selected snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: soranakahara/sdk-reference-build-test
          ref: ${{ inputs.snapshot_sha }}
          path: snapshot
          persist-credentials: false
      - name: Prepare Pages content
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R snapshot/swift snapshot/android snapshot/unity snapshot/build-info.json _site/
          # Upstream navigation targets the developer site, outside this Pages project.
          find _site/swift _site/android -type f -name '*.html' \
            -exec sed -i 's|href="/en/"|href="https://developers.line.biz/en/"|g' {} +
          snapshot_sha="$(git -C snapshot rev-parse HEAD)"
          printf 'Generated snapshot: %s\n' "$snapshot_sha" >> "$GITHUB_STEP_SUMMARY"
          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>SDK reference snapshots</title>
          <h1>SDK reference snapshots</h1>
          <ul><li><a href="swift/">Swift</a></li><li><a href="android/">Android</a></li>
          <li><a href="unity/">Unity</a></li></ul>
          <p>Generated snapshot: <code>$snapshot_sha</code></p>
          <p><a href="build-info.json">Build provenance</a></p>
          </html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
