name: Publish SDK references

on:
  workflow_run:
    workflows: ['Build and commit SDK references']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  pages:
    if: github.server_url == 'https://github.com' && github.repository == 'soranakahara/sdk-reference-build-test' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: soranakahara/sdk-reference-build-test
          ref: generated
          persist-credentials: false
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: 'false'
      - name: Adjust developer site navigation
        run: |
          # Upstream navigation targets the developer site, outside this Pages project.
          find swift android -type f -name '*.html' \
            -exec sed -i 's|href="/en/"|href="https://developers.line.biz/en/"|g' {} +
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - name: Deploy generated references
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
